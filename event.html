<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event — Seattle Tour De Pints</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    #page-content.loading .event-hero { min-height: 320px; }
    .sk-h1  { height: 40px; width: 70%; margin-bottom: 1rem; border-radius:4px; }
    .sk-p   { height: 16px; width: 50%; margin-bottom: 0.5rem; border-radius:4px; }
    .sk-p2  { height: 16px; width: 35%; border-radius:4px; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <a href="index.html" class="site-brand">
      <span class="emoji">🚲🍺</span>
      <span>Seattle Tour De Pints</span>
    </a>
    <nav>
      <a href="index.html#events">All Events</a>
      <a href="index.html#donate">Donate</a>
    </nav>
  </div>
</header>

<div id="page-content" class="loading">
  <!-- Loading placeholder -->
  <div class="event-hero">
    <div class="event-hero-inner">
      <a href="index.html#events" class="back-link">← All Events</a>
      <div class="skeleton sk-h1"></div>
      <div class="skeleton sk-p"></div>
      <div class="skeleton sk-p2"></div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/footer.js"></script>
<script src="js/stickers.js"></script>
<script>
// ── Mountain SVG + sticker wall (reused in event hero) ────────────────────
const MOUNTAIN_SVG = `
  <div class="sticker-wall" aria-hidden="true">
    <div class="sticker sticker-circle sticker-green"
         style="top:10%;left:0.5%;transform:rotate(-10deg);">FREMONT<br>BREWING<br>CO.</div>
    <div class="sticker sticker-tag sticker-yellow"
         style="top:60%;left:1.5%;transform:rotate(-5deg);">KEEP PEDALING!</div>
    <div class="sticker sticker-circle sticker-amber"
         style="top:10%;right:0.5%;transform:rotate(9deg);">GEORGETOWN<br>BREWING<br>CO.</div>
    <div class="sticker sticker-tag sticker-teal"
         style="top:57%;right:1.5%;transform:rotate(4deg);">☔ RAIN OR SHINE</div>
    <!-- PNG image stickers injected here by js/stickers.js after render -->
  </div>
  <div class="event-bike-lane" aria-hidden="true">
    <span class="animated-biker" style="animation-duration:7s; animation-delay:0s;">🚴💨</span>
    <span class="animated-biker" style="animation-duration:10s; animation-delay:-4s; font-size:1.3rem; top:8px;">🚴🍺</span>
    <span class="animated-biker" style="animation-duration:13s; animation-delay:-8s; font-size:1rem; top:13px;">🚴🌲</span>
  </div>
  <div class="event-hero-mountain" aria-hidden="true">
    <svg viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,120 L0,72 C120,58 240,68 360,52 C480,36 600,46 720,34 C840,22 960,34 1080,46 C1200,58 1320,48 1440,52 L1440,120 Z"
            fill="#1E3D55" opacity="0.4"/>
      <path d="M0,120 L0,96 L180,88 L300,92 L400,78 L460,82 L510,68 L548,56 L568,40 L580,30 L590,25 L600,22 L610,25 L622,30 L636,40 L658,56 L694,68 L740,80 L840,88 L960,84 L1100,90 L1280,94 L1440,90 L1440,120 Z"
            fill="#1B4332"/>
      <path d="M590,25 L600,18 L610,25 L607,34 L600,32 L593,34 Z"
            fill="rgba(240,240,255,0.5)"/>
      <path d="M0,120 L0,108 C240,100 480,106 720,101 C960,96 1200,103 1440,106 L1440,120 Z"
            fill="#0A1A10"/>
    </svg>
  </div>`;

// ── Helpers ───────────────────────────────────────────────────────────────
function getMonthDay(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const month = new Date(y, m - 1, 1).toLocaleString("en-US", { month: "short" });
  return { month, day: d, year: y };
}

function renderEvent(ev) {
  const { month, day, year } = getMonthDay(ev.event_date);
  const tags        = Array.isArray(ev.tags)         ? ev.tags         : [];
  const stops       = Array.isArray(ev.stops)        ? ev.stops        : [];
  const donateLinks = Array.isArray(ev.donate_links) ? ev.donate_links : [];
  const activeDonate = donateLinks.filter(d => d.url);


  const donateSource = activeDonate;
  const donateHtml = donateSource.length
    ? `<div class="event-detail-section">
         <h2>Support the Ride</h2>
         <p>This event is free — donations help us keep it going!</p>
         <div class="donate-grid" style="margin-top:0.75rem;">
           ${donateSource.map(d =>
             `<a href="${d.url}" class="donate-card" target="_blank" rel="noopener noreferrer">
               <div class="icon">${d.icon}</div>
               <h3>${d.label}</h3>
               <p>Donate via ${d.label}</p>
             </a>`
           ).join("")}
         </div>
       </div>`
    : "";

  const heroMeta = [
    `📍 ${ev.location}`,
    `🗓️ ${month} ${day}, ${year}`,
    `🕙 ${ev.time_of_day}`,
    ev.distance   ? `🚴 ${ev.distance}`   : null,
    ev.difficulty ? `⚡ ${ev.difficulty}` : null,
  ].filter(Boolean).map(m => `<span>${m}</span>`).join("");

  const longDesc = (ev.long_description || ev.description || "")
    .split(/\n\n+/)
    .map(p => `<p>${p.trim()}</p>`)
    .join("");

  const stopsHtml = stops.length
    ? `<ul class="stops-list">${stops.map(s => `<li>${s}</li>`).join("")}</ul>`
    : `<p>Route details coming soon.</p>`;

  return `
    <div class="event-hero">
      <div class="event-hero-inner">
        <a href="index.html#events" class="back-link">← All Events</a>
        <h1>${ev.title}</h1>
        <div class="hero-meta">${heroMeta}</div>
        <div class="hero-buttons">
          <a href="#register" class="btn btn-gold">Register Free</a>
        </div>
      </div>
      ${MOUNTAIN_SVG}
    </div>

    <div class="event-layout">
      <!-- LEFT: Details -->
      <div class="event-details">
        <div class="event-detail-section">
          <h2>About This Ride</h2>
          ${longDesc}
        </div>
        <div class="event-detail-section">
          <h2>🍺 Brewery Stops</h2>
          ${stopsHtml}
        </div>
        <div class="event-detail-section">
          <h2>What to Know</h2>
          <ul>
            <li>Helmets are absolutely required.</li>
            <li>Follow all traffic laws — this is a public road ride.</li>
            <li>Ride at your own pace; this is not a race.</li>
            <li>Please drink responsibly. Or better yet, don't drink at all.</li>
            <li>No registration fee — this event is completely free.</li>
            <li>Liability waiver required — you will sign it during registration.</li>
          </ul>
        </div>
        ${donateHtml}
      </div>

      <!-- RIGHT: Registration form -->
      <div id="register">
        <div class="sidebar-card">
          <div class="sidebar-card-header">Reserve Your Spot — Free</div>
          <div class="sidebar-card-body">
            <form id="reg-form" novalidate>
              <div class="form-grid two-col" style="margin-bottom:0.85rem;">
                <div class="field">
                  <label for="fname">First name *</label>
                  <input type="text" id="fname" placeholder="Jane"
                         required autocomplete="given-name" />
                </div>
                <div class="field">
                  <label for="lname">Last name *</label>
                  <input type="text" id="lname" placeholder="Doe"
                         required autocomplete="family-name" />
                </div>
              </div>
              <div class="field" style="margin-bottom:0.85rem;">
                <label for="email">Email address *</label>
                <input type="email" id="email" placeholder="jane@example.com"
                       required autocomplete="email" />
                <small>We'll send your confirmation and ride updates here.</small>
              </div>
              <button type="submit" id="submit-btn" class="btn btn-green btn-full">
                Reserve My Spot →
              </button>
              <p class="text-gray text-sm text-center mt-1">
                Free event · You will be asked to sign a waiver
              </p>
            </form>
            <div id="reg-success" class="form-message success" style="display:none;"></div>
            <div id="reg-error"   class="form-message error"   style="display:none;"></div>
          </div>
        </div>
      </div>
    </div>

  `;
}

// ── Load event ────────────────────────────────────────────────────────────
(async () => {
  const params  = new URLSearchParams(window.location.search);
  const slug    = params.get("id");
  const content = document.getElementById("page-content");

  function showNotFound() {
    content.className = "";
    content.innerHTML = `
      <div class="not-found">
        <h2>Event Not Found</h2>
        <p>We couldn't find that event. It may have been removed or the link is incorrect.</p>
        <a href="index.html" class="btn btn-green">← Back to All Events</a>
      </div>`;
  }

  if (!slug) { showNotFound(); return; }

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    content.className = "";
    content.innerHTML = `
      <div class="not-found">
        <h2>Database not connected</h2>
        <p>Add your Supabase credentials to <code>js/config.js</code> to load events.</p>
        <a href="index.html" class="btn btn-ghost">← Back</a>
      </div>`;
    return;
  }

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  try {
    const { data: ev, error } = await db
      .from("events")
      .select("*")
      .eq("slug", slug)
      .eq("published", true)
      .single();

    if (error || !ev) { showNotFound(); return; }

    document.title = `${ev.title} — Seattle Tour De Pints`;
    content.className = "";
    content.innerHTML = renderEvent(ev);
    window.placeAllStickers(); // scatter PNG stickers into the now-present sticker-wall

    // ── Registration form ─────────────────────────────────────────────────
    const form      = document.getElementById("reg-form");
    const submitBtn = document.getElementById("submit-btn");
    const msgOk     = document.getElementById("reg-success");
    const msgErr    = document.getElementById("reg-error");

    // Validate fields then redirect to waiver page
    form.addEventListener("submit", e => {
      e.preventDefault();
      msgErr.style.display = "none";
      if (!form.checkValidity()) { form.reportValidity(); return; }

      const p = new URLSearchParams({
        slug:  ev.slug,
        title: encodeURIComponent(ev.title),
        fname: document.getElementById("fname").value.trim(),
        lname: document.getElementById("lname").value.trim(),
        email: document.getElementById("email").value.trim().toLowerCase(),
      });
      window.location.href = `waiver.html?${p.toString()}`;
    });

    function showError(msg) {
      msgErr.textContent    = msg;
      msgErr.style.display  = "block";
      submitBtn.disabled    = false;
      submitBtn.textContent = "Reserve My Spot →";
      msgErr.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

  } catch (err) {
    console.error("Error loading event:", err);
    showNotFound();
  }
})();
</script>
</body>
</html>
